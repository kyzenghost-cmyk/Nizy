name: Build CLONE X APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clone-x-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CLONE X and engine
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Apply CLONE X black-and-white branding
        run: |
          chmod +x ci/brand.sh
          ci/brand.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build runtime payload and native bridge
        working-directory: engine/CloniX
        run: gradle :runtime-payload:assembleRelease :native-bridge:assembleRelease --stacktrace

      - name: Package runtime payload
        working-directory: engine/CloniX
        run: |
          chmod +x ci/prepare_payload.sh
          ci/prepare_payload.sh

      - name: Build CLONE X
        working-directory: engine/CloniX
        run: gradle :app:assembleRelease -x lint --stacktrace

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CLONE-X-APK
          path: engine/CloniX/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
