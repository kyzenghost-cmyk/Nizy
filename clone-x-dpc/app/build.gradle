plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'app.clonex.profile'
    compileSdk 35

    defaultConfig {
        // New application ID avoids update-signature conflicts with earlier
        // debug APKs signed by ephemeral GitHub Actions debug keystores.
        applicationId 'app.clonex.profile.v2'
        minSdk 28
        targetSdk 29
        versionCode 2
        versionName '0.2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
